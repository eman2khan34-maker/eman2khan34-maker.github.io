<html lang="en">
<head>

  <!-- Instagram-style logo font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <style>
    :root {
      --black: #000;
      --card: #121212;
      --line: #262626;
      --white: #fff;
      --muted: #a8a8a8;
      --pink: #ff3040;
      --gradient: linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--black);
      color: var(--white);
      font-family: Arial, Helvetica, sans-serif;
      padding-bottom: 75px;
    }

    button, input, textarea { font: inherit; }
    button { cursor: pointer; }
    .hidden { display: none !important; }

    header {
      height: 58px;
      padding: 0 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      background: rgba(0,0,0,.96);
      z-index: 20;
    }

    .logo {
      font-family: "Grand Hotel", cursive;
      font-size: 38px;
      letter-spacing: .5px;
      background: var(--gradient);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      line-height: 1;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .icon-btn {
      border: 0;
      color: white;
      background: transparent;
      font-size: 26px;
      padding: 3px;
    }

    .page {
      max-width: 620px;
      margin: auto;
    }

    .stories {
      display: flex;
      gap: 15px;
      overflow-x: auto;
      padding: 14px 12px 12px;
      border-bottom: 1px solid var(--line);
      scrollbar-width: none;
    }

    .stories::-webkit-scrollbar { display: none; }

    .story {
      flex: 0 0 67px;
      text-align: center;
      font-size: 11px;
      color: white;
      overflow: hidden;
    }

    .story-ring {
      width: 64px;
      height: 64px;
      padding: 3px;
      margin: auto auto 5px;
      border-radius: 50%;
      background: var(--gradient);
    }

    .story-ring.seen { background: #555; }

    .story-inner {
      height: 100%;
      width: 100%;
      border: 2px solid black;
      border-radius: 50%;
      overflow: hidden;
      background: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .story-inner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .story-plus {
      position: absolute;
      bottom: 0;
      right: 0;
      background: #0095f6;
      width: 21px;
      height: 21px;
      border: 2px solid black;
      border-radius: 50%;
      font-size: 16px;
      line-height: 17px;
    }

    .ad-wrap {
      text-align: center;
      padding: 9px 5px;
      overflow: hidden;
    }

    .ad-label {
      font-size: 9px;
      color: #666;
      margin-bottom: 3px;
    }

    .post {
      border-bottom: 1px solid var(--line);
      margin-bottom: 9px;
    }

    .post-head {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 12px;
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
      background: #333;
      flex-shrink: 0;
    }

    .post-user {
      font-size: 13px;
      font-weight: bold;
      flex: 1;
      overflow-wrap: anywhere;
    }

    .post-more {
      border: 0;
      background: none;
      color: white;
      font-size: 22px;
    }

    .post-media {
      width: 100%;
      display: block;
      max-height: 700px;
      object-fit: contain;
      background: #080808;
    }

    .post-actions {
      display: flex;
      align-items: center;
      padding: 8px 12px 2px;
      gap: 17px;
    }

    .action {
      border: 0;
      background: none;
      color: white;
      font-size: 25px;
      padding: 0;
      line-height: 1.2;
    }

    .action.liked { color: var(--pink); }
    .action.saved { color: #feda75; }

    .save-action { margin-left: auto; }

    .like-count {
      font-size: 13px;
      font-weight: bold;
      padding: 5px 12px;
    }

    .caption {
      font-size: 13px;
      padding: 2px 12px 13px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .caption strong { margin-right: 5px; }

    .post-date {
      font-size: 10px;
      color: #777;
      padding: 0 12px 12px;
    }

    .empty {
      padding: 50px 20px;
      text-align: center;
      color: var(--muted);
      line-height: 1.7;
    }

    .bottom-nav {
      height: 58px;
      position: fixed;
      z-index: 30;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0,0,0,.97);
      border-top: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-around;
    }

    .nav-btn {
      background: none;
      border: 0;
      color: white;
      font-size: 25px;
      min-width: 42px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .nav-upload {
      width: 34px;
      height: 30px;
      border: 2px solid white;
      border-radius: 9px;
      font-size: 24px;
      line-height: 24px;
    }

    .nav-btn.active { color: #ff70a8; }

    .profile-nav {
      width: 27px;
      height: 27px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid white;
    }

    /* Login screen */

    #loginScreen {
      min-height: 80vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px;
    }

    .login-card {
      width: 100%;
      max-width: 370px;
      text-align: center;
      padding: 30px 22px;
      border: 1px solid var(--line);
      border-radius: 13px;
    }

    .login-card .logo { font-size: 58px; }

    .login-card p {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .primary {
      border: 0;
      border-radius: 8px;
      padding: 12px 18px;
      color: white;
      background: linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf);
      font-weight: bold;
    }

    .google-login {
      width: 100%;
      margin-top: 18px;
      background: #fff;
      color: #111;
      border: 0;
      border-radius: 8px;
      padding: 12px;
      font-weight: bold;
    }

    .error {
      color: #ff5252 !important;
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    /* Upload modal */

    .modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0,0,0,.82);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }

    .modal-card {
      background: #181818;
      border: 1px solid #333;
      border-radius: 14px;
      padding: 20px;
      width: 100%;
      max-width: 440px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .close-btn {
      color: white;
      border: 0;
      background: none;
      font-size: 25px;
    }

    .select-file {
      border: 1px dashed #666;
      border-radius: 10px;
      padding: 24px 10px;
      text-align: center;
      color: #bbb;
      cursor: pointer;
    }

    #mediaPreview {
      display: block;
      width: 100%;
      max-height: 280px;
      object-fit: contain;
      margin-top: 14px;
      border-radius: 8px;
    }

    textarea {
      display: block;
      width: 100%;
      margin-top: 15px;
      min-height: 75px;
      background: #080808;
      color: white;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 12px;
      resize: vertical;
    }

    .progress {
      height: 8px;
      background: #333;
      border-radius: 20px;
      margin-top: 15px;
      overflow: hidden;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: var(--gradient);
      transition: width .15s;
    }

    .progress-text {
      text-align: center;
      font-size: 12px;
      color: #ccc;
      margin-top: 7px;
    }

    .profile-panel {
      padding: 30px 15px;
      text-align: center;
    }

    .profile-panel img {
      width: 85px;
      height: 85px;
      border-radius: 50%;
      object-fit: cover;
    }

    .profile-panel h2 { margin-bottom: 5px; }

    footer {
      text-align: center;
      padding: 25px 8px;
      font-size: 10px;
      color: #666;
    }

    .fixed-ad {
      position: fixed;
      bottom: 58px;
      z-index: 25;
      width: 100%;
      min-height: 50px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #080808;
      border-top: 1px solid #222;
      overflow: hidden;
    }

    body.with-ad { padding-bottom: 128px; }

    body.with-ad .bottom-nav { bottom: 50px; }

    @media (min-width: 700px) {
      header { padding: 0 calc((100% - 620px)/2); }
      .stories { margin-top: 8px; }
      .post { border: 1px solid var(--line); border-radius: 5px; }
    }
  </style>
</head>

  <script type="module">
    // =====================================================
    // FIREBASE SDK
    // =====================================================

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

    import {
      getFirestore,
      collection,
      addDoc,
      query,
      orderBy,
      onSnapshot,
      serverTimestamp,
      doc,
      updateDoc,
      arrayUnion,
      arrayRemove,
      increment,
      getDoc,
      setDoc,
      limit,
      runTransaction
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

    import {
      getStorage,
      ref,
      uploadBytesResumable,
      getDownloadURL
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-storage.js";


    // =====================================================
    // FIREBASE CONFIG — VERIFY APP ID IN FIREBASE CONSOLE
    // =====================================================

    // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyCXn3NFLxGNpUEgWdXNVS0Nz6-uTMKG78o",
  authDomain: "glovix-bfdec.firebaseapp.com",
  projectId: "glovix-bfdec",
  storageBucket: "glovix-bfdec.firebasestorage.app",
  messagingSenderId: "223762437338",
  appId: "1:223762437338:web:230026374f9112936901e3",
  measurementId: "G-JDN1ZT5CS5"
};

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const storage = getStorage(app);
    const googleProvider = new GoogleAuthProvider();


    // =====================================================
    // ELEMENTS AND STATE
    // =====================================================

    const $ = id => document.getElementById(id);

    let currentUser = null;
    let allPosts = [];
    let selectedFile = null;
    let feedUnsubscribe = null;
    let uploadTask = null;
    let uploading = false;

    const loginScreen = $("loginScreen");
    const mainApp = $("mainApp");
    const bottomNav = $("bottomNav");
    const feed = $("feed");

    const modal = $("uploadModal");
    const fileInput = $("fileInput");
    const previewArea = $("previewArea");
    const captionInput = $("captionInput");
    const progress = $("progress");
    const progressBar = $("progressBar");
    const progressText = $("progressText");
    const uploadError = $("uploadError");
    const publishBtn = $("publishBtn");


    // =====================================================
    // LOGIN
    // =====================================================

    $("googleLogin").addEventListener("click", async () => {
      $("loginError").textContent = "";
      $("googleLogin").disabled = true;
      $("googleLogin").textContent = "Signing in...";

      try {
        await signInWithPopup(auth, googleProvider);
      } catch (error) {
        $("loginError").textContent =
          error.message || "Google login failed.";
      } finally {
        $("googleLogin").disabled = false;
        $("googleLogin").textContent = "Continue with Google";
      }
    });


    // =====================================================
    // USER PROFILE
    // =====================================================

    async function saveUserProfile(user) {
      const userRef = doc(db, "users", user.uid);
      const snap = await getDoc(userRef);

      const profile = {
        uid: user.uid,
        username: user.displayName || user.email?.split("@")[0] || "GLOVIX User",
        userphoto: user.photoURL || "",
        email: user.email || ""
      };

      if (!snap.exists()) {
        await setDoc(userRef, {
          ...profile,
          createdAt: serverTimestamp()
        });
      } else {
        await setDoc(userRef, profile, { merge: true });
      }

      return profile;
    }


    // =====================================================
    // AUTH STATE
    // =====================================================

    onAuthStateChanged(auth, async user => {
      currentUser = user;

      if (user) {
        loginScreen.classList.add("hidden");
        mainApp.classList.remove("hidden");
        bottomNav.classList.remove("hidden");
        $("fixedAd").classList.remove("hidden");
        document.body.classList.add("with-ad");

        try {
          const profile = await saveUserProfile(user);
          const photo = profile.userphoto ||
            "https://placehold.co/100x100/222/fff?text=User";

          $("navProfilePhoto").src = photo;
          $("myStoryPhoto").src = photo;
          $("profilePhoto").src = photo;
          $("profileName").textContent = profile.username;
          $("profileEmail").textContent = profile.email;

          startFeed();
          showPage("home");
        } catch (error) {
          console.error("Profile error:", error);
          alert("Could not load your profile: " + error.message);
        }
      } else {
        loginScreen.classList.remove("hidden");
        mainApp.classList.add("hidden");
        bottomNav.classList.add("hidden");
        $("fixedAd").classList.add("hidden");
        document.body.classList.remove("with-ad");

        if (feedUnsubscribe) {
          feedUnsubscribe();
          feedUnsubscribe = null;
        }
      }
    });


    // =====================================================
    // LOGOUT
    // =====================================================

    $("logoutBtn").addEventListener("click", async () => {
      try {
        await signOut(auth);
      } catch (error) {
        alert(error.message);
      }
    });


    // =====================================================
    // REAL-TIME FIRESTORE FEED
    // =====================================================

    function startFeed() {
      if (feedUnsubscribe) feedUnsubscribe();

      const postsQuery = query(
        collection(db, "posts"),
        orderBy("createdAt", "desc"),
        limit(100)
      );

      feedUnsubscribe = onSnapshot(postsQuery, snapshot => {
        allPosts = snapshot.docs.map(item => ({
          id: item.id,
          ...item.data()
        }));

        renderFeed();
        renderReels();

        $("profilePostCount").textContent =
          allPosts.filter(p => p.uid === currentUser?.uid).length + " posts";
      }, error => {
        console.error("Feed error:", error);
        feed.innerHTML =
          '<div class="empty">Could not load posts. Check Firestore rules and indexes.<br>' +
          escapeHTML(error.message) + '</div>';
      });
    }


    // =====================================================
    // SAFE HTML TEXT
    // =====================================================

    function escapeHTML(value = "") {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      })[char]);
    }


    // =====================================================
    // RENDER POSTS
    // =====================================================

    function postHTML(post) {
      const liked = (post.likes || []).includes(currentUser?.uid);
      const saved = localStorage.getItem("glovix-save-" + post.id) === "yes";

      const username = escapeHTML(post.username || "GLOVIX User");
      const photo = escapeHTML(post.userphoto ||
        "https://placehold.co/100x100/222/fff?text=U");

      const media = post.type === "video"
        ? `<video class="post-media" src="${escapeHTML(post.imageUrl)}"
             controls playsinline preload="metadata"></video>`
        : `<img class="post-media" src="${escapeHTML(post.imageUrl)}"
             alt="GLOVIX post" loading="lazy">`;

      const caption = escapeHTML(post.caption || "");

      return `
        <article class="post" data-id="${escapeHTML(post.id)}">
          <div class="post-head">
            <img class="avatar" src="${photo}" alt="">
            <div class="post-user">${username}</div>
            <button class="post-more" data-action="more" title="More">•••</button>
          </div>

          ${media}

          <div class="post-actions">
            <button class="action ${liked ? "liked" : ""}"
              data-action="like" title="Like">${liked ? "♥" : "♡"}</button>
            <button class="action" data-action="comment" title="Comment">♡</button>
            <button class="action" data-action="share" title="Share">➤</button>
            <button class="action save-action ${saved ? "saved" : ""}"
              data-action="save" title="Save">${saved ? "▣" : "▢"}</button>
          </div>

          <div class="like-count">${(post.likes || []).length} likes</div>
          <div class="caption">
            <strong>${username}</strong>${caption || "MADE IN MIAN ABDULLAH GULZAR"}
          </div>
          <div class="post-date">GLOVIX</div>
        </article>
      `;
    }


    function renderFeed() {
      feed.innerHTML = "";

      if (!allPosts.length) {
        feed.innerHTML =
          '<div class="empty">Welcome to GLOVIX!<br>Be the first to share a post. 📸</div>';
        return;
      }

      allPosts.forEach((post, index) => {
        feed.insertAdjacentHTML("beforeend", postHTML(post));

        // Ad after every 3 posts.
        if ((index + 1) % 3 === 0) {
          feed.insertAdjacentHTML("beforeend", `
            <div class="ad-wrap">
              <div class="ad-label">ADVERTISEMENT</div>
              <ins class="adsbygoogle"
                style="display:block"
                data-ad-client="ca-pub-1234567890123456"
                data-ad-slot="3333333333"
                data-ad-format="fluid"
                data-ad-layout="in-article"></ins>
            </div>
          `);
        }
      });

      // Request ads for newly rendered ad slots.
      document.querySelectorAll("#feed ins.adsbygoogle:not([data-adsbygoogle-status])")
        .forEach(ad => {
          try {
            (window.adsbygoogle = window.adsbygoogle || []).push({});
          } catch (error) {
            console.warn("AdSense:", error.message);
          }
        });
    }


    // =====================================================
    // LIKE / COMMENT / SHARE / SAVE
    // =====================================================

    feed.addEventListener("click", async event => {
      const button = event.target.closest("[data-action]");
      if (!button) return;

      const postElement = button.closest(".post");
      const postId = postElement?.dataset.id;
      const post = allPosts.find(p => p.id === postId);
      if (!post || !currentUser) return;

      const action = button.dataset.action;
      const postRef = doc(db, "posts", postId);

      try {
        if (action === "like") {
          const liked = (post.likes || []).includes(currentUser.uid);

          await updateDoc(postRef, {
            likes: liked
              ? arrayRemove(currentUser.uid)
              : arrayUnion(currentUser.uid)
          });

          if (!liked) {
            button.classList.add("liked");
            button.textContent = "♥";
          }
        }

        if (action === "comment") {
          const comment = prompt("Write your comment:");
          if (comment && comment.trim()) {
            await addDoc(collection(db, "posts", postId, "comments"), {
              uid: currentUser.uid,
              username: currentUser.displayName ||
                currentUser.email?.split("@")[0] || "User",
              text: comment.trim(),
              createdAt: serverTimestamp()
            });
            alert("Comment posted!");
          }
        }

        if (action === "share") {
          const url = location.origin + location.pathname + "?post=" + postId;

          if (navigator.share) {
            await navigator.share({ title: "GLOVIX", url });
          } else {
            await navigator.clipboard.writeText(url);
            alert("Post link copied!");
          }
        }

        if (action === "save") {
          const key = "glovix-save-" + postId;
          const wasSaved = localStorage.getItem(key) === "yes";

          if (wasSaved) {
            localStorage.removeItem(key);
          } else {
            localStorage.setItem(key, "yes");
          }

          button.classList.toggle("saved", !wasSaved);
          button.textContent = wasSaved ? "▢" : "▣";
        }

        if (action === "more") {
          if (post.uid === currentUser.uid) {
            if (confirm("Delete your post? This will remove the post document.")) {
              await runTransaction(db, async transaction => {
                const snap = await transaction.get(postRef);
                if (!snap.exists()) return;
                if (snap.data().uid !== currentUser.uid) {
                  throw new Error("You can only delete your own posts.");
                }
                transaction.delete(postRef);
              });
            }
          } else {
            alert("GLOVIX post options");
          }
        }

      } catch (error) {
        console.error(error);
        alert("Action failed: " + error.message);
      }
    });


    // =====================================================
    // REELS: ALL VIDEO POSTS
    // =====================================================

    function renderReels() {
      const videos = allPosts.filter(p => p.type === "video");
      $("reelsFeed").innerHTML = videos.length
        ? videos.map(postHTML).join("")
        : '<div class="empty">No videos yet.<br>Upload a video to start GLOVIX Reels.</div>';
    }


    // =====================================================
    // BOTTOM NAVIGATION
    // =====================================================

    function showPage(page) {
      $("profilePage").classList.add("hidden");
      $("reelsPage").classList.add("hidden");
      $("searchPage").classList.add("hidden");
      feed.classList.add("hidden");
      $("stories").classList.add("hidden");

      document.querySelectorAll(".nav-btn[data-page]")
        .forEach(btn => btn.classList.toggle("active", btn.dataset.page === page));

      if (page === "home") {
        feed.classList.remove("hidden");
        $("stories").classList.remove("hidden");
      }

      if (page === "profile") $("profilePage").classList.remove("hidden");
      if (page === "reels") $("reelsPage").classList.remove("hidden");
      if (page === "search") $("searchPage").classList.remove("hidden");
    }

    bottomNav.addEventListener("click", event => {
      const button = event.target.closest("[data-page]");
      if (button) showPage(button.dataset.page);
    });


    // =====================================================
    // SEARCH POSTS BY USERNAME
    // =====================================================

    $("searchInput").addEventListener("input", event => {
      const term = event.target.value.toLowerCase().trim();
      const results = allPosts.filter(post =>
        (post.username || "").toLowerCase().includes(term)
      );

      $("searchResults").innerHTML = term
        ? results.map(post => `
            <div style="padding:12px;border-bottom:1px solid #333">
              <strong>${escapeHTML(post.username || "User")}</strong>
            </div>
          `).join("") || '<p class="empty">No matching users in posts.</p>'
        : "";
    });


    // =====================================================
    // UPLOAD MODAL
    // =====================================================

    function openUpload() {
      if (!currentUser) return;
      modal.classList.remove("hidden");
    }

    function closeUpload() {
      if (uploading) return;
      modal.classList.add("hidden");
      selectedFile = null;
      fileInput.value = "";
      previewArea.innerHTML = "";
      captionInput.value = "";
      uploadError.textContent = "";
      progress.classList.add("hidden");
      progressBar.style.width = "0%";
      progressText.textContent = "";
    }

    $("navUpload").addEventListener("click", openUpload);
    $("closeModal").addEventListener("click", closeUpload);

    modal.addEventListener("click", event => {
      if (event.target === modal) closeUpload();
    });


    // =====================================================
    // FILE PREVIEW
    // =====================================================

    fileInput.addEventListener("change", () => {
      selectedFile = fileInput.files?.[0] || null;
      previewArea.innerHTML = "";
      uploadError.textContent = "";

      if (!selectedFile) return;

      const isImage = selectedFile.type.startsWith("image/");
      const isVideo = selectedFile.type.startsWith("video/");

      if (!isImage && !isVideo) {
        uploadError.textContent = "Choose an image or video file.";
        selectedFile = null;
        return;
      }

      // 100 MB maximum file size.
      if (selectedFile.size > 100 * 1024 * 1024) {
        uploadError.textContent = "Maximum file size is 100 MB.";
        selectedFile = null;
        return;
      }

      const url = URL.createObjectURL(selectedFile);
      const media = document.createElement(isVideo ? "video" : "img");

      media.id = "mediaPreview";
      media.src = url;
      media.controls = isVideo;
      media.alt = "Upload preview";

      previewArea.appendChild(media);
    });


    // =====================================================
    // REAL FIREBASE STORAGE UPLOAD + PROGRESS
    // =====================================================

    publishBtn.addEventListener("click", async () => {
      if (!currentUser) {
        uploadError.textContent = "Please log in first.";
        return;
      }

      if (!selectedFile) {
        uploadError.textContent = "Please select a photo or video.";
        return;
      }

      if (uploading) return;

      uploading = true;
      publishBtn.disabled = true;
      publishBtn.textContent = "Uploading...";
      uploadError.textContent = "";
      progress.classList.remove("hidden");
      progressBar.style.width = "0%";
      progressText.textContent = "Preparing upload...";

      try {
        const file = selectedFile;
        const type = file.type.startsWith("video/") ? "video" : "image";

        const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
        const path = "glovix-posts/" + currentUser.uid + "/" +
          Date.now() + "_" + safeName;

        const storageRef = ref(storage, path);

        uploadTask = uploadBytesResumable(storageRef, file, {
          contentType: file.type
        });

        const snapshot = await new Promise((resolve, reject) => {
          uploadTask.on("state_changed", snap => {
            const percent = snap.totalBytes > 0
              ? Math.round((snap.bytesTransferred / snap.totalBytes) * 100)
              : 0;

            progressBar.style.width = percent + "%";
            progressText.textContent = percent + "% uploaded";
          }, reject, () => resolve(uploadTask.snapshot));
        });

        const imageUrl = await getDownloadURL(snapshot.ref);

        progressBar.style.width = "100%";
        progressText.textContent = "Saving post...";

        const username = currentUser.displayName ||
          currentUser.email?.split("@")[0] || "GLOVIX User";

        await addDoc(collection(db, "posts"), {
          uid: currentUser.uid,
          imageUrl: imageUrl,
          type: type,
          username: username,
          userphoto: currentUser.photoURL || "",
          caption: captionInput.value.trim() ||
            "MADE IN MIAN ABDULLAH GULZAR",
          likes: [],
          createdAt: serverTimestamp()
        });

        progressText.textContent = "Post shared successfully!";
        publishBtn.textContent = "Shared!";

        setTimeout(() => {
          uploading = false;
          publishBtn.disabled = false;
          publishBtn.textContent = "Share post";
          closeUpload();
          showPage("home");
        }, 900);

      } catch (error) {
        console.error("Upload error:", error);
        uploadError.textContent = error.message || "Upload failed.";
        uploading = false;
        publishBtn.disabled = false;
        publishBtn.textContent = "Share post";
      }
    });


    // =====================================================
    // HEADER BUTTONS
    // =====================================================

    $("headerLike").addEventListener("click", () => {
      alert("Welcome to GLOVIX notifications!");
    });

    $("headerMessage").addEventListener("click", () => {
      alert("GLOVIX messaging will be added in a future update.");
    });

  </script>
</body>
</html>
